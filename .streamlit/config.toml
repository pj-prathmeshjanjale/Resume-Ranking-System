[theme]
base            = "dark"
primaryColor    = "#7c3aed"
backgroundColor = "#07090f"
secondaryBackgroundColor = "#0d1117"
textColor       = "#f8fafc"
font            = "sans serif"

[server]
headless        = true
enableCORS      = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
